# mergin.dh.unica.it: Mergin Maps Community Edition su dhgeo 90.147.144.148, porta 8086
# (merginmaps-proxy). Repository della configurazione: Dh-unica/mergin.dh.unica.it
# App Mergin Maps e plugin QGIS caricano e scaricano progetti anche di centinaia di MB:
# niente limite basso sul corpo e niente buffering su disco del proxy.
server {
    listen 80;
    listen [::]:80;
    server_name mergin.dh.unica.it;
    return 301 https://mergin.dh.unica.it$request_uri;
}

server {
    listen 443 ssl;

    server_name mergin.dh.unica.it;
    if ($php2shell_bloccato) { return 403; }  # PHP2Shell, vedi 00-php2shell.conf

    ssl_certificate /etc/digicertca/live/dh.unica.it/Cert_bundle.pem;
    ssl_certificate_key /etc/digicertca/live/dh.unica.it/dh.key;

    # Here we define the web-root for our SSL proof
    location /.well-known {
        allow all;
        root /var/www/ssl-proof/dhunica/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_pass http://90.147.144.148:8086;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        client_max_body_size 4G;            # come nella ssl-proxy.conf ufficiale di Mergin Maps
        proxy_request_buffering off;
        proxy_buffering off;

        # enable gzip compression
        gzip on;
        gzip_min_length  1100;
        gzip_buffers  4 32k;
        gzip_types    text/plain application/javascript application/x-javascript text/xml text/css image/svg+xml ;
        gzip_vary on;
        # end gzip configuration
    }

}
