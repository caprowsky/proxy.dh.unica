# -----------------------------------------------------------------------------
# AIUCD 2026 - redirect canonico verso il dominio SENZA www
# Tutto il traffico (http/https, www/non-www) converge su
# https://aiucd2026.unica.it
#
# Prerequisiti esterni al proxy:
#  - DNS: deve esistere un record per aiucd2026.unica.it (A su 90.147.144.144
#    oppure CNAME a dh.unica.it / www.aiucd2026.unica.it)
#  - Backend WordPress: WORDPRESS_URL deve puntare a https://aiucd2026.unica.it
#    per evitare il redirect-loop canonico www <-> non-www
#  - Certificato: il SAN copre gia' aiucd2026.unica.it e www.aiucd2026.unica.it
# -----------------------------------------------------------------------------

# 1) HTTP (porta 80), entrambi gli host -> HTTPS non-www
server {
    listen 80;
    listen [::]:80;
    server_name aiucd2026.unica.it www.aiucd2026.unica.it;
    return 301 https://aiucd2026.unica.it$request_uri;
}

# 2) HTTPS con www -> HTTPS non-www
server {
    listen 443 ssl;

    server_name www.aiucd2026.unica.it;

    ssl_certificate /etc/digicertca/live/aiucd2026/Cert-2.pem;
    ssl_certificate_key /etc/digicertca/live/aiucd2026/aiucd.key;

    return 301 https://aiucd2026.unica.it$request_uri;
}

# 3) HTTPS non-www -> reverse proxy verso il backend WordPress
server {
    listen 443 ssl;

    server_name aiucd2026.unica.it;

    ssl_certificate /etc/digicertca/live/aiucd2026/Cert-2.pem;
    ssl_certificate_key /etc/digicertca/live/aiucd2026/aiucd.key;

    # Here we define the web-root for our SSL proof
#    location /.well-known {
#        allow all;
#        root /var/www/ssl-proof/archiviostorico/;
#    }
#    auth_basic "Restricted";                                              #For Basic Auth
#    auth_basic_user_file /etc/password_custom/.htpasswd_400anni_ateneo;   #For Basic Auth

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://90.147.144.180:7000/;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_redirect http://90.147.144.180:7000/ https://$host/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
        client_max_body_size 4000M;
        proxy_request_buffering off;
        proxy_buffering off;

        # enable gzip compression
        gzip on;
        gzip_min_length  1100;
        gzip_buffers  4 32k;
        gzip_types    text/plain application/javascript application/x-javascript text/xml text/css image/svg+xml ;
        gzip_vary on;
        # end gzip configuration
    }

    location ~* /files/.*.php$ {
            deny all;
            access_log off;
            log_not_found off;
    }

}
