# File che non devono mai uscire dai backend: configurazioni con le password del DB, log e dump.
# Contesto http. Ogni server che ospita Omeka S ha `if ($file_riservato) { return 404; }`.
#
# Il 25/10/2026 le quattro istanze Omeka S (storiedigitali, risorse_colo, Risorse, digitaliststor)
# servivano config/database.ini con la password del DB, e storiedigitali anche logs/application.log
# e un dump completo del DB in web/dump-tmp/. Il blocco dei .ini nel .htaccess di Omeka non funziona:
# il vhost di wodby/apache ha <Location /> Require all granted, che Apache applica dopo il .htaccess.
# Analisi: dh-unica_monitoring/reports/2026-10-24-tutte-php2shell.md

# $uri è già decodificato e normalizzato: copre anche %2e, // e /./
map $uri $file_riservato {
    default                                          0;
    "~*\.(ini|log|sql|env)(\.(gz|bz2|xz|zip))?$"     1;
    "~*/dump-tmp(/|$)"                               1;
}
