# lizmap.dh.unica.it: WebGIS Lizmap (progetto PARC) su dhgeo 90.147.144.148.
# Repository della configurazione: Dh-unica/lizmap.dh.unica.it
#   /        -> unica-lizmap-web (Nginx + PHP-FPM di Lizmap), porta 8084
#   /files/  -> unica-filebrowser (Filebrowser Quantum, baseURL /files/), porta 8087
server {
    listen 80;
    listen [::]:80;
    server_name lizmap.dh.unica.it;
    return 301 https://lizmap.dh.unica.it$request_uri;
}

server {
    listen 443 ssl;

    server_name lizmap.dh.unica.it;
    if ($php2shell_bloccato) { return 403; }  # PHP2Shell, vedi 00-php2shell.conf
    if ($file_riservato) { return 404; }      # vedi 00-file-riservati.conf

    ssl_certificate /etc/digicertca/live/dh.unica.it/Cert_bundle.pem;
    ssl_certificate_key /etc/digicertca/live/dh.unica.it/dh.key;

    # Here we define the web-root for our SSL proof
    location /.well-known {
        allow all;
        root /var/www/ssl-proof/dhunica/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://90.147.144.148:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
        client_max_body_size 4000M;

        # enable gzip compression
        gzip on;
        gzip_min_length  1100;
        gzip_buffers  4 32k;
        gzip_types    text/plain application/javascript application/x-javascript text/xml text/css image/svg+xml ;
        gzip_vary on;
        # end gzip configuration
    }

    # Filebrowser: il prefisso /files/ resta nella richiesta (proxy_pass senza URI)
    location /files/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://90.147.144.148:8087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
        client_max_body_size 4000M;
        proxy_request_buffering off;
    }

    location ~* /files/.*.php$ {
	    deny all;
	    access_log off;
	    log_not_found off;
    }

}
