# PHP2Shell (CVE-2026-109618, CVE-2026-109619): misura temporanea, finché i backend
# non sono su PHP corretto (8.2.35, 8.3.36, 8.4.27, 8.5.12). Contesto http: vale per tutti i siti.
# Analisi e piano: dh-unica_monitoring/reports/2026-10-24-tutte-php2shell.md

# Lo strumento visto nei log del 21-23/10/2026 si dichiara nello user-agent ("PHP2Shell/1.0.0").
# Ogni server che fa proxy_pass ha `if ($php2shell_bloccato) { return 403; }`.
map $http_user_agent $php2shell_bloccato {
    default        0;
    "~*php2shell"  1;
}

