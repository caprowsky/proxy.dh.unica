# doc.dh.unica.it: sito dismesso il 13/11/2026 (non era docs.dh.unica.it, rimandava alla registrazione di WordPress).
# Il blocco resta solo perché il nome ha ancora un record DNS verso questo proxy: senza, nginx servirebbe il primo
# server in 443 (400.unica.it, con il suo certificato). Risponde 410 come i siti archiviati del multisite.
# Quando l'ateneo toglie il record DNS, il file si può cancellare.
server {
    listen 80;
    listen [::]:80;
    server_name doc.dh.unica.it;
    return 410;
}

server {
    listen 443 ssl;

    server_name doc.dh.unica.it;

    ssl_certificate /etc/digicertca/live/dh.unica.it/Cert_bundle.pem;
    ssl_certificate_key /etc/digicertca/live/dh.unica.it/dh.key;

    return 410;
}
